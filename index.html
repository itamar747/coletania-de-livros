<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Coletânea de Livros - Sistema de Livros</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
  <h1 class="mb-4 text-center">Coletânea de Livros</h1>

  <div class="card mb-4 shadow-sm">
    <div class="card-header bg-primary text-white" id="formTitulo">Cadastrar Novo Livro</div>
    <div class="card-body">
      <form id="formLivro" class="row g-3">
        <input type="hidden" id="livroId">
        
        <div class="col-md-4">
          <input type="text" id="titulo" class="form-control" placeholder="Título" required>
        </div>
        <div class="col-md-3">
          <input type="text" id="autor" class="form-control" placeholder="Autor" required>
        </div>
        <div class="col-md-2">
          <input type="number" id="ano" class="form-control" placeholder="Ano" required>
        </div>
        <div class="col-md-3 d-flex gap-2">
          <button type="submit" id="btnSalvar" class="btn btn-success flex-grow-1">Salvar</button>
          <button type="button" id="btnCancelar" class="btn btn-secondary d-none" onclick="cancelarEdicao()">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <div class="card shadow-sm">
    <div class="card-header bg-dark text-white">Livros Cadastrados</div>
    <div class="card-body p-0">
      <table class="table table-striped table-hover mb-0 text-center">
        <thead>
          <tr>
            <th>ID</th>
            <th>Título</th>
            <th>Autor</th>
            <th>Ano</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabelaLivros">
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  async function carregarLivros() {
    const res = await fetch('/livros');
    const livros = await res.json();
    
    const tabela = document.getElementById('tabelaLivros');
    tabela.innerHTML = '';

    livros.forEach(livro => {
      tabela.innerHTML += `
        <tr>
          <td>${livro.id}</td>
          <td>${livro.titulo}</td>
          <td>${livro.autor}</td>
          <td>${livro.ano}</td>
          <td>
            <button class="btn btn-warning btn-sm me-1" onclick="iniciarEdicao(${livro.id}, '${livro.titulo}', '${livro.autor}', ${livro.ano})">Editar</button>
            <button class="btn btn-danger btn-sm" onclick="apagarLivro(${livro.id})">Excluir</button>
          </td>
        </tr>
      `;
    });
  }

  function iniciarEdicao(id, titulo, autor, ano) {
    document.getElementById('livroId').value = id;
    document.getElementById('titulo').value = titulo;
    document.getElementById('autor').value = autor;
    document.getElementById('ano').value = ano;

    document.getElementById('formTitulo').innerText = 'Atualizar Livro (ID: ' + id + ')';
    document.getElementById('formTitulo').className = 'card-header bg-warning text-dark';
    document.getElementById('btnSalvar').innerText = 'Atualizar';
    document.getElementById('btnCancelar').classList.remove('d-none');
  }

  function cancelarEdicao() {
    document.getElementById('formLivro').reset();
    document.getElementById('livroId').value = '';
    document.getElementById('formTitulo').innerText = 'Cadastrar Novo Livro';
    document.getElementById('formTitulo').className = 'card-header bg-primary text-white';
    document.getElementById('btnSalvar').innerText = 'Salvar';
    document.getElementById('btnCancelar').classList.add('d-none');
  }

  document.getElementById('formLivro').addEventListener('submit', async (e) => {
    e.preventDefault();

    const id = document.getElementById('livroId').value;
    const livroData = {
      titulo: document.getElementById('titulo').value,
      autor: document.getElementById('autor').value,
      ano: Number(document.getElementById('ano').value)
    };

    if (id) {
      await fetch(`/livros/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(livroData)
      });
    } else {
      await fetch('/livros', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(livroData)
      });
    }

    cancelarEdicao();
    carregarLivros();
  });

  async function apagarLivro(id) {
    if (confirm('Tem a certeza que deseja excluir este livro?')) {
      await fetch(`/livros/${id}`, { method: 'DELETE' });
      carregarLivros();
    }
  }

  carregarLivros();
</script>

</body>
</html>
